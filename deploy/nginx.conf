# ─────────────────────────────────────────────────────────────────────────────
# Trading Wolf AI — Nginx configuration (production)
#   • HTTP → HTTPS redirect
#   • serves the built SPA (dist/) at /
#   • proxies /api and /ws to the Node backend (port 3001)
#   • Telegram webhook endpoint (post-request; secured by secret token)
#   • security headers (CSP, HSTS, X-Frame-Options, nosniff, referrer-policy)
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS
server {
    listen 80;
    server_name trading-wolf.example.com;

    # Let's Encrypt challenge path (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name trading-wolf.example.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP — tighten after confirming your CDN/font sources
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'self';" always;

    client_max_body_size 10m;

    # ── SPA static files ─────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived static assets (hashed filenames from vite build)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend API + WebSocket proxy ────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ── Telegram webhook (POST only; the backend verifies the secret) ────
    location = /telegram/webhook {
        proxy_pass http://127.0.0.1:3001/telegram/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_except POST { deny all; }
    }

    # ── Health ───────────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Logs
    access_log /var/log/nginx/wolf-access.log;
    error_log  /var/log/nginx/wolf-error.log warn;
}
