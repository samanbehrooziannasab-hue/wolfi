# ─────────────────────────────────────────────────────────────────────────────
# Trading Wolf AI — Docker Compose (production VPS stack)
#
#   services:
#     postgres  → main database
#     redis     → cache / queue / rate limit / websocket presence
#     api       → Node.js backend (Hono): REST + WebSocket + Telegram webhook
#     worker    → engine loop: scan → risk → execution → monitor (24/7)
#     nginx     → reverse proxy, HTTP→HTTPS, SSL (Let's Encrypt), static SPA
#
#   Usage:
#     cp deploy/env.example .env        # then fill in real values
#     docker compose -f deploy/docker-compose.yml up -d
#     docker compose -f deploy/docker-compose.yml logs -f api worker
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  frontend:
    image: oven/bun:1-alpine
    working_dir: /workspace
    env_file: ../.env
    volumes:
      - ..:/workspace
      - frontend_dist:/workspace/dist
    command: sh -c "test \"$${VITE_BACKEND:-rest}\" = rest && bun install --frozen-lockfile && bun run build"
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wolf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
      POSTGRES_DB: wolf_trading
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../server/migrations:/docker-entrypoint-initdb.d:ro   # runs all migrations on first boot
    ports:
      - "127.0.0.1:5432:5432"   # never expose to the internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolf -d wolf_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"   # never expose to the internet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://wolf:${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}@postgres:5432/wolf_trading
      REDIS_URL: redis://redis:6379/0
      ROLE: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"   # nginx proxies to this
    # Database migrations/seed run on the host install/update scripts. The API
    # container must never hide a failed seed during every restart.
    command: ["node", "dist/api.js"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://wolf:${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}@postgres:5432/wolf_trading
      REDIS_URL: redis://redis:6379/0
      ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  frontend_dist:
